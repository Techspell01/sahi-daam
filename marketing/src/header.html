<!doctype html>
<!-- 1500×500: Twitter/X profile header. The profile photo covers the bottom left, so the text sits top left. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>

  .display { font-size: 78px; }
  .sub { font-size: 24px; }
  .phones { display: flex; gap: 26px; }
  .phone { width: 220px; margin-top: 10px; }

<body class="dark">

    <p class="sub">Check before you pay, anywhere in Kerala.</p>
  </div>
  <div class="phones">
    <div class="phone"><img src="../screens/7-dark-tomato.png" alt=""></div>
    <div class="phone"><img src="../screens/6-dark-rates.png" alt=""></div>
